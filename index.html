<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detektif Rumah Aneh</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Special+Elite&display=swap">
<style>
:root{--bg:#e8edf1;--card:#fbfcfd;--ink:#14213d;--mut:#55627a;--line:#c9d3dd;--tape:#f2c230;--tapeink:#14213d;--ok:#1d6b5f;--bad:#b3341f;--okbg:#d9eee9;--badbg:#f6dcd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1826;--card:#18253a;--ink:#e8edf4;--mut:#9fb0c8;--line:#2c3c56;--ok:#5fd0bb;--bad:#ff8f7a;--okbg:#14403a;--badbg:#4a2620}}
:root[data-theme="dark"]{--bg:#0f1826;--card:#18253a;--ink:#e8edf4;--mut:#9fb0c8;--line:#2c3c56;--ok:#5fd0bb;--bad:#ff8f7a;--okbg:#14403a;--badbg:#4a2620}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 'DM Sans',system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 56px}
h1,h2,h3{font-family:'Special Elite',Georgia,serif;font-weight:400;line-height:1.2;margin:0}
h1{font-size:34px}h2{font-size:26px}h3{font-size:20px}
.bar{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--mut);margin-bottom:18px}
.trk{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.trk i{display:block;height:100%;background:var(--tape);transition:width .3s}
.pts{font-weight:700;color:var(--ink);background:var(--tape);color:var(--tapeink);padding:2px 12px;border-radius:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
.tag{display:inline-block;background:var(--tape);color:var(--tapeink);font-family:'Special Elite',serif;font-size:15px;padding:3px 12px;transform:rotate(-1.5deg);margin-bottom:10px}
p{margin:0 0 12px}.mut{color:var(--mut);font-size:15px}
button{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:8px;padding:12px 18px;cursor:pointer;min-height:48px}
button:hover{background:var(--tape);color:var(--tapeink)}button:focus-visible,input:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
button.pri{background:var(--ink);color:var(--card)}button.pri:hover{background:var(--tape);color:var(--tapeink)}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>button{flex:1;min-width:140px}
input[type=text]{font:inherit;width:100%;padding:12px;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.scn{margin-bottom:12px}.hot{cursor:pointer}.hot:hover rect.h{fill:rgba(242,194,48,.35)}.evi{font-size:20px;border-left:6px solid var(--tape);padding-left:14px;margin:6px 0 18px}
.stamp{display:inline-block;font-family:'Special Elite',serif;font-size:24px;border:3px solid;padding:2px 14px;transform:rotate(-4deg);margin:2px 0 10px}
.stamp.f{color:var(--ok)}.stamp.i{color:var(--bad)}
.fb{border-radius:8px;padding:14px;margin:12px 0}.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin-bottom:10px;font-weight:500}
.opt.sel{background:var(--tape);color:var(--tapeink)}
.opt.ok{background:var(--okbg);color:var(--ink);border-color:var(--ok)}.opt.no{background:var(--badbg);color:var(--ink);border-color:var(--bad)}
.opt b{font-family:'Special Elite',serif;font-weight:400;min-width:24px}
svg{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;touch-action:manipulation;cursor:crosshair}
label{display:block;font-weight:700;margin:12px 0 4px}input[type=range]{width:100%}
.big{font-family:'Special Elite',serif;font-size:56px;line-height:1}
ul.r{padding-left:20px;margin:8px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
var S={st:0,found:{},cls:{},cur:null,pk:null,tt:null,score:0,team:''};
var OB={
 jendela:{n:'Jendela',t:'Kaca jendela pecah. Serpihannya jatuh di halaman, di luar rumah.',f:true,e:'Bisa dilihat dan dicek langsung.'},
 brankas:{n:'Brankas',t:'Brankas terbuka dan uangnya hilang. Tidak ada bekas dirusak.',f:true,e:'Bisa dilihat dan dicek langsung.'},
 teh:{n:'Cangkir teh',t:'Teh di dalam cangkir masih hangat.',f:true,e:'Bisa dicek dengan menyentuh cangkirnya.'},
 kucing:{n:'Kucing',t:'Kucing tidur nyenyak dan tidak kaget sama sekali.',f:true,e:'Ini yang terlihat. Mengapa kucing tenang belum kita ketahui.'},
 tetangga:{n:'Tetangga',t:'Kata tetangga: “Pasti ada maling jahat tadi malam!”',f:false,e:'Ini kesimpulan tetangga. Belum ada bukti yang menunjukkan hal itu.'}};
var HP=[
 {t:'Jendela dipecah dari dalam rumah supaya terlihat seperti dibobol maling.',p:20,e:'Paling cocok dengan bukti: kaca jatuh ke luar, brankas tidak dirusak, teh masih hangat. Tapi ini masih dugaan yang harus dites.'},
 {t:'Maling masuk lewat jendela lalu kabur.',p:5,e:'Kurang cocok. Kalau maling masuk dari luar, kacanya seharusnya jatuh ke dalam rumah.'},
 {t:'Pemilik rumah pasti orang jahat.',p:0,e:'Ini tebakan sifat orang. Tidak ada bukti yang bisa mengujinya.'}];
var TS=[
 {t:'Cek apakah ada serpihan kaca di dalam rumah.',g:true,e:'Tepat. Kalau banyak serpihan di dalam, dugaan kita salah. Inilah bukti yang bisa menggugurkan dugaan.'},
 {t:'Tanya tetangga apakah pemilik rumah baik hati.',g:false,e:'Itu menilai sifat orang, bukan menguji dugaan.'},
 {t:'Cari tahu warna sepatu pemilik rumah.',g:false,e:'Warna sepatu tidak ada hubungannya dengan dugaan kita.'}];
var app=document.getElementById('app');
function n(){return Object.keys(S.found).length}
function bar(){var p=S.st==1?n()/5*100:(S.st>1?100:0);return '<div class="bar"><span>'+['Mulai','Cari petunjuk','Buat dugaan','Uji dugaan','Hasil'][S.st]+'</span><div class="trk"><i style="width:'+p+'%"></i></div><span class="pts">'+S.score+' poin</span></div>'}
function bd(id,x,y){return S.found[id]?'<circle cx="'+x+'" cy="'+y+'" r="15" fill="#1d6b5f" stroke="#fff" stroke-width="3"/><path d="M'+(x-7)+' '+y+' l5 6 l10 -12" stroke="#fff" stroke-width="3" fill="none"/>':'<circle cx="'+x+'" cy="'+y+'" r="15" fill="#f2c230" stroke="#14213d" stroke-width="2"/><text x="'+x+'" y="'+(y+6)+'" text-anchor="middle" font-size="18" font-weight="700" fill="#14213d">?</text>'}
function scene(){
 return '<svg class="scn" viewBox="0 0 640 400" aria-label="Gambar ruang tamu rumah aneh dengan lima benda yang bisa diketuk">'+
 '<rect width="640" height="400" fill="#efe3c8"/><rect y="300" width="640" height="100" fill="#b9875a"/><rect x="0" y="296" width="640" height="8" fill="#8a5a2b"/>'+
 '<path d="M220 40 L420 40 L420 110 L220 110Z" fill="#d9c9a3" opacity=".6"/><text x="320" y="82" text-anchor="middle" font-size="22" font-family="Special Elite,serif" fill="#8a5a2b">Rumah Pak Budi</text>'+
 '<g class="hot" data-id="jendela"><rect x="40" y="110" width="150" height="150" fill="#8a5a2b"/><rect x="50" y="120" width="130" height="100" fill="#bfe3f2"/><rect x="50" y="220" width="130" height="30" fill="#6fae5a"/><path d="M60 125 L115 175 L95 215 M115 175 L170 130 M115 175 L150 215" stroke="#fff" stroke-width="3" fill="none"/><path d="M70 236 l10 -8 l6 10Z M105 240 l9 -9 l5 11Z M140 237 l11 -7 l4 10Z" fill="#e8f6fb"/><rect class="h" x="40" y="110" width="150" height="150" fill="transparent"/>'+bd('jendela',185,115)+'</g>'+
 '<g class="hot" data-id="tetangga"><circle cx="250" cy="228" r="20" fill="#f1c9a0"/><rect x="228" y="248" width="44" height="52" rx="12" fill="#c4472c"/><path d="M262 205 h70 a8 8 0 0 1 8 8 v22 a8 8 0 0 1 -8 8 h-52 l-14 12 l2 -12 a8 8 0 0 1 -6 -8 v-22 a8 8 0 0 1 0 0Z" fill="#fff" stroke="#14213d" stroke-width="2"/><text x="305" y="230" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Maling!</text><rect class="h" x="226" y="200" width="120" height="100" fill="transparent"/>'+bd('tetangga',350,205)+'</g>'+
 '<g class="hot" data-id="brankas"><rect x="370" y="180" width="90" height="116" rx="6" fill="#6b7686"/><rect x="380" y="190" width="70" height="96" rx="4" fill="#2c3340"/><path d="M460 180 l34 14 v102 l-34 -0Z" fill="#8c97a8"/><circle cx="478" cy="245" r="7" fill="#f2c230"/><rect class="h" x="370" y="180" width="130" height="116" fill="transparent"/>'+bd('brankas',500,180)+'</g>'+
 '<g class="hot" data-id="teh"><rect x="400" y="316" width="130" height="14" fill="#8a5a2b"/><rect x="410" y="330" width="10" height="50" fill="#8a5a2b"/><rect x="510" y="330" width="10" height="50" fill="#8a5a2b"/><path d="M440 316 v-26 h34 v26Z" fill="#fff" stroke="#14213d" stroke-width="2"/><path d="M474 296 q16 0 0 16" stroke="#14213d" stroke-width="3" fill="none"/><path d="M450 282 q-8 -12 0 -22 M462 282 q-8 -12 0 -22" stroke="#9aa7b8" stroke-width="3" fill="none"/><rect class="h" x="400" y="256" width="130" height="80" fill="transparent"/>'+bd('teh',535,262)+'</g>'+
 '<g class="hot" data-id="kucing"><ellipse cx="580" cy="360" rx="42" ry="22" fill="#e09a3c"/><circle cx="550" cy="345" r="18" fill="#e09a3c"/><path d="M538 332 l4 -14 l8 10Z M556 328 l8 -12 l4 14Z" fill="#e09a3c"/><path d="M543 345 q5 4 10 0 M557 345 q5 4 10 0" stroke="#14213d" stroke-width="2" fill="none"/><text x="590" y="332" font-size="20" fill="#55627a">z z</text><rect class="h" x="530" y="312" width="100" height="70" fill="transparent"/>'+bd('kucing',620,322)+'</g>'+
 '</svg>'}
function render(){
 var h=bar(),o=S.cur?OB[S.cur]:null;
 if(S.st==0){
  h='<h1>Detektif Rumah Aneh</h1><p class="mut">Kasus Rumah Pak Budi (cerita karangan)</p><div class="card"><span class="tag">Tugas tim</span><p>Ada uang yang hilang dari brankas di Rumah Pak Budi. Kalian jadi detektif. Cari petunjuk di rumah, lalu buat dugaan yang benar-benar didukung bukti.</p><p><b>Dua kata penting:</b><br><b>Fakta</b> = yang bisa dilihat dan dicek.<br><b>Dugaan</b> = kesimpulan kita. Bisa benar, bisa salah, jadi harus diuji.</p><label for="tm">Nama tim</label><input id="tm" type="text" maxlength="30" placeholder="Contoh: Tim Elang"></div><button class="pri" onclick="S.team=document.getElementById(\'tm\').value||\'Tim tanpa nama\';S.st=1;render()">Masuk ke rumah</button>';
 } else if(S.st==1){
  h+='<p class="mut">Ketuk benda bertanda ? untuk memeriksanya. Sudah diperiksa: '+n()+' dari 5.</p>'+scene();
  if(o){h+='<div class="card"><span class="tag">'+o.n+'</span><p class="evi">'+o.t+'</p>';
   if(S.cls[S.cur]===undefined){h+='<p>Ini <b>fakta</b> atau <b>dugaan</b>?</p><div class="row"><button onclick="cl(true)">Fakta</button><button onclick="cl(false)">Dugaan</button></div>'}
   else{var ok=S.cls[S.cur]===o.f;h+='<span class="stamp '+(o.f?'f':'i')+'">'+(o.f?'FAKTA':'DUGAAN')+'</span><div class="fb '+(ok?'ok':'no')+'"><b>'+(ok?'Benar, +10 poin. ':'Belum tepat. ')+'</b>'+o.e+'</div>'}
   h+='</div>'}
  if(Object.keys(S.cls).length==5)h+='<button class="pri" onclick="S.st=2;S.cur=null;render()">Semua petunjuk terkumpul. Buat dugaan</button>';
 } else if(S.st==2){
  h+='<div class="card"><span class="tag">Buat dugaan</span><p>Dugaan mana yang paling cocok dengan semua bukti?</p>';
  HP.forEach(function(x,k){var c=S.pk===null?'':(k==S.pk||x.p==20?(x.p==20?' ok':' no'):'');h+='<button class="opt'+c+'" '+(S.pk!==null?'disabled':'')+' onclick="pick('+k+')"><b>'+'ABC'[k]+'</b><span>'+x.t+(S.pk!==null&&(k==S.pk||x.p==20)?'<br><small>'+x.e+'</small>':'')+'</span></button>'});
  if(S.pk!==null)h+='<button class="pri" onclick="S.st=3;render()">Lanjut: uji dugaan</button>';
  h+='</div>';
 } else if(S.st==3){
  h+='<div class="card"><span class="tag">Uji dugaan</span><p>Dugaan kita: jendela dipecah dari dalam. Apa yang paling bisa <b>membuktikan dugaan ini salah</b>?</p>';
  TS.forEach(function(x,k){var c=S.tt===null?'':(x.g?' ok':(S.tt==k?' no':''));h+='<button class="opt'+c+'" '+(S.tt!==null?'disabled':'')+' onclick="tst('+k+')"><b>'+(k+1)+'</b><span>'+x.t+(S.tt!==null&&(x.g||S.tt==k)?'<br><small>'+x.e+'</small>':'')+'</span></button>'});
  if(S.tt!==null)h+='<button class="pri" onclick="S.st=4;render()">Lihat hasil tim</button>';
  h+='</div>';
 } else {
  var r=S.score>=75?'Detektif ahli':(S.score>=50?'Detektif cermat':'Detektif pemula');
  h='<div class="card"><span class="tag">Kasus ditutup sementara</span><h2>'+S.team.replace(/</g,'&lt;')+'</h2><p class="big">'+S.score+'</p><p class="mut">dari 90 poin · '+r+'</p><p>Ingat: detektif bekerja dari bukti, lalu mengujinya. Detektif tidak menebak sifat orang.</p><h3>Ngobrol bareng tim</h3><ul class="r"><li>Petunjuk mana yang tadinya terasa seperti fakta, padahal dugaan?</li><li>Bukti apa yang bisa membuat dugaan tim kalian salah?</li><li>Mengapa menebak sifat orang tidak membantu mencari jawaban?</li></ul></div><button class="pri" onclick="S={st:0,found:{},cls:{},cur:null,pk:null,tt:null,score:0,team:S.team};render()">Main lagi</button>';
 }
 app.innerHTML=h;
}
function cl(v){S.cls[S.cur]=v;if(v===OB[S.cur].f)S.score+=10;render()}
function pick(k){S.pk=k;S.score+=HP[k].p;render()}
function tst(k){S.tt=k;if(TS[k].g)S.score+=20;render()}
document.addEventListener('click',function(e){
 var g=e.target.closest&&e.target.closest('[data-id]');if(!g||S.st!=1)return;
 var id=g.getAttribute('data-id');S.found[id]=true;S.cur=id;render();
});
render();
</script>
</body>
</html>
